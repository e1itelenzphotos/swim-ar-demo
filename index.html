<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swimming AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 30px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: white;
    }
 
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  a-scene {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  #startButton {
    position: fixed;
    z-index: 9999;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 30px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: white;
  }
</style>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>
      <video
        id="swimVideo"
        src="./swim.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#swimVideo"
        position="0 0 0"
        width="1"
        height="0.5625">
      </a-video>

    </a-entity>

  </a-scene>

  <script>
    const startButton = document.querySelector("#startButton");
    const scene = document.querySelector("a-scene");
    const video = document.querySelector("#swimVideo");
    const target = document.querySelector("[mindar-image-target]");

    startButton.addEventListener("click", async () => {

      startButton.style.display = "none";

      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch (error) {
        console.log(error);
      }

      const mindarSystem = scene.systems["mindar-image-system"];

      if (mindarSystem) {
        mindarSystem.start();
      }
    });

    target.addEventListener("targetFound", () => {
      video.currentTime = 0;
      video.play();
    });

    target.addEventListener("targetLost", () => {
      video.pause();
    });
  </script>

</body>
</html>
