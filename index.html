<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Test</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <!-- AR.js NFT / Image Tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #message {
      position: fixed;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 9999;
      pointer-events: none;
      text-shadow: 0 2px 4px black;
    }
  </style>
</head>

<body>

<div id="message">
  Point your camera at the AR target
</div>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="antialias: true; alpha: true; precision: medium;"
  embedded
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
>

  <!-- SAMPLE VIDEO -->
  <a-assets>
    <video
      id="testVideo"
      src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous">
    </video>
  </a-assets>


  <!-- YOUR EXISTING ALEXA NFT TARGET -->
  <a-nft
    id="target"
    type="nft"
    url="https://raw.githubusercontent.com/e1telenzphotos/swim-ar-demo/main/alexa"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >

    <!-- VIDEO -->
    <a-video
      src="#testVideo"
      position="50 150 -100"
      rotation="90 0 180"
      width="300"
      height="175">
    </a-video>

  </a-nft>


  <a-entity camera></a-entity>

</a-scene>


<script>

const target = document.querySelector("#target");
const video = document.querySelector("#testVideo");

target.addEventListener("markerFound", function () {
  console.log("TARGET FOUND!");

  video.play().catch(function(error) {
    console.log("Video play error:", error);
  });
});

target.addEventListener("markerLost", function () {
  console.log("TARGET LOST!");

  video.pause();
  video.currentTime = 0;
});

</script>

</body>
</html>
