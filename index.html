<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Test</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .message {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 20px;
      font-family: Arial;
      z-index: 9999;
    }
  </style>
</head>

<body>

<div class="message">
  Point camera at the Alexa target image
</div>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  embedded
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
>

  <a-nft
    type="nft"
    url="./alexa"
    emitevents="true"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >

    <!-- BIG TEST OBJECT -->
    <a-box
      position="0 0 0"
      rotation="0 0 0"
      color="red"
      depth="100"
      height="100"
      width="100">
    </a-box>

  </a-nft>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
