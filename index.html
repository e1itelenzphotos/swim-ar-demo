<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swim AR Demo</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>

  <!-- AR.js Pattern Marker Tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .arjs-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="arjs-loader">
    Loading AR...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Swimming video -->
    <video
      id="swimVideo"
      src="swim.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline>
    </video>

    <!-- ORANGE STICKER TARGET -->
   <a-marker
    type="pattern"
    url="https://raw.githubusercontent.com/e1itelenzphotos/swim-ar-demo/main/pattern-arjs_target_sticker.patt">

      <a-video
        src="#swimVideo"
        position="0 0 0"
        rotation="-90 0 0"
        width="1"
        height="0.5625">
      </a-video>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>

    const video = document.querySelector("#swimVideo");
    const loader = document.querySelector(".arjs-loader");

    window.addEventListener("load", function () {
      setTimeout(function () {
        loader.style.display = "none";
      }, 3000);
    });

    document.addEventListener("click", function () {
      video.play().catch(() => {});
    });

    document.addEventListener("touchstart", function () {
      video.play().catch(() => {});
    });

  </script>

</body>
</html>
